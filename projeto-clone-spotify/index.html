<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" integrity="sha512-9xKTRVabjVeZmc+GUW8GgSmcREDunMM+Dt/GrzchfN8tkwHizc5RP4Ok/MXFFy5rIjJjzhndFScTceq5e6GvVQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css">
  <title>Music Club</title>
</head>

<body>
  <div class="container">
    <nav class="sidebar">
      <div class="nav-logo">
        <i class="fa-brands fa-spotify"></i>
      </div>
      <div class="nav-library">
        <i class="fa-solid fa-book-bookmark"></i>
        <p>Sua Biblioteca +</p>
      </div>
      <div class="nav-playlist">
        <h5>Cria sua Primeira Playlist</h5>
        <p>É fácil, vai da certo!</p>
        <button>Criar Playlist</button>
        <div>
          <h5>Que tal seguir um podcast</h5>
          <p>Avisaremos voçê do nossos episódios</p>
          <button>Explore podcast</button>
        </div>
        <div class="nav-footer">
          <a href="#">Legal</a>
          <a href="#">Centro de Privacidade</a>
          <a href="#">Política de Privacidade</a>
          <a href="#">Cookies</a>
          <a href="#">Sobre anúncios</a>
          <a href="#">Legal</a>
          <a href="#">Acessibilidade</a>
        </div>
        <button class="nav-lang-button">
          <i class="fa-solid fa-globe"></i>
          Português do Brasil
        </button>
      </div>
    </nav>
    <main>
      <header class="seach-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input placeholder="O que deseja ouvir?">
      </header>
      <section>
        <h2>Artistas Populares</h2>
        <div class="artists-grid">
          <!-- Colocar dados no JS  -->
        </div>
        <h2>Álbuns Populares</h2>
        <div class="albums-grid">
          <!-- Colocar  dados no JS  -->
        </div>
      </section>
    </main>
  </div>
</body>

</html>
